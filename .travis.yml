language: php

notifications:
  slack:
    if: (branch = master) OR (branch =~ /^(release).*$/)
    on_success: always
    on_failure: always

php:
  - nightly
  - 8.3

jobs:
  allow_failures:
    - php: nightly

install:
  - travis_retry composer install --no-interaction --prefer-dist --no-progress

script:
  - composer test

cache:
  directories:
    - $HOME/.composer/cache
